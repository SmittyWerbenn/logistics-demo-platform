<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Sistem Tracking &amp; Resi Digital - GMS Logistics</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: GH Pages has no server-side
      // rewrite, so a direct load or refresh on a deep link hits this 404
      // page instead of index.html. This redirects back to index.html,
      // packing the real path into a query string that index.html unpacks.
      // https://github.com/rafgraph/spa-github-pages
      //
      // Project sites (username.github.io/repo/...) need to keep the first
      // path segment (/repo); user/org sites and custom domains keep none.
      var l = window.location;
      var isProjectPages = /\.github\.io$/i.test(l.hostname) && l.pathname.split("/").filter(Boolean).length > 1;
      var pathSegmentsToKeep = isProjectPages ? 1 : 0;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
