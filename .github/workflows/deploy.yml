name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute Pages base path
        run: |
          # A custom domain (public/CNAME) serves the site from the domain root,
          # so assets must use "/". Without one, GitHub Pages project sites
          # live under /<repo>/.
          if [ -f public/CNAME ]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            if [ "$REPO_NAME" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
              echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
            else
              echo "VITE_BASE_PATH=/$REPO_NAME/" >> "$GITHUB_ENV"
            fi
          fi

      - name: Type check & build (with SPA 404 fallback)
        run: npm run build:pages

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
